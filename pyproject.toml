[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iPhoto"
version = "6.1.0"
description = "Folder-native photo manager with Live Photo support"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "iPhoto Team"}]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4",
  "PySide6>=6.10.1",
  "Pillow>=10",
  "pillow-heif>=0.16",
  "imagehash>=4",
  "xxhash>=3",
  "python-dateutil>=2",
  "opencv-python-headless>=4.10",
  "reverse-geocoder>=1.5.1",
  "pyexiftool>=0.5.5",
  "numpy>=2.3.4",
  "numba>=0.60",
  "mapbox-vector-tile>=1.2",
  "av>=11.0.0",
  "PyOpenGL>=3.1.7",
  "PyOpenGL_accelerate>=3.1.7",
  "rawpy>=0.23",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-env",
    "pytest-mock",
    "pytest-qt",
    "pytest-timeout",
]
dev = [
    "pytest",
    "pytest-env",
    "pytest-mock",
    "pytest-qt",
    "pytest-timeout",
    "ruff",
    "black",
    "mypy",
    "types-Pillow",
    "types-python-dateutil",
]
ai-demo = [
    "insightface>=0.7.3,<1.0",
    "onnxruntime>=1.18,<2",
]
agent = [
    "clip-onnx>=1.0",
    "transformers>=4.35",
    "ollama>=0.3",
]
ai = [
    "onnxruntime>=1.17.0,<2",
    "rapidocr-onnxruntime>=1.3.0,<2",
    "huggingface-hub>=0.20.0,<1",
]

[project.scripts]
iphoto = "iPhoto.cli:app"
iphoto-gui = "iPhoto.gui.main:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"iPhoto" = ["**/*.qsb", "**/*.frag", "**/*.vert", "**/*.svg", "**/*.json", "**/*.yaml"]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "BLE", "A", "C4", "PIE", "Q", "RUF"]
ignore = ["E203"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``-p no:pytest-qt`` must match the plugin's pytest11 entry-point name, which
# is ``pytest-qt`` (hyphen). The previous ``-p no:pytestqt`` matched nothing, so
# the plugin stayed active as soon as it was installed (the dev extras install
# it), and its event-loop pump aborts the interpreter with
# "Fatal Python error: Aborted" under this project's offscreen Qt platform.
# The GUI suites that need the plugin are excluded below; run them explicitly
# with ``pytest -p pytest-qt tests/gui`` to re-enable it for that session.
addopts = "-ra -p no:pytest-qt --ignore=tests/ui --ignore=tests/gui"
pythonpath = ["src"]
# Numba JIT is disabled for the suite so filter tests stay fast and repeatable.
# This needs the `pytest-env` plugin, which is declared in the test/dev extras.
env = ["NUMBA_DISABLE_JIT=1"]

[tool.typer]
pretty_exceptions_enable = true
# ---------------------------------------------------------------------------
# Type checking
#
# ``# type: ignore[override]`` appeared 222 times, purely because Qt's stubs type
# event handlers differently from their Python signatures. Silencing the code once
# keeps every real ``[attr-defined]``/``[union-attr]`` suppression visible.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
disable_error_code = ["override"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["maps.*", "iPhoto.gui.ui.ui_main_window"]
ignore_errors = true
